[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
tokio-tungstenite = "0.26"
clap = { version = "4", features = ["derive", "env"] }
minijinja = "2"
minijinja-contrib = { version = "2", features = ["pycompat"] }
llama-cpp-2 = { version = "=0.1.161", optional = true }

candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }

[features]
# In-process llama.cpp engine. Pulls in the CUDA-backed `llama-cpp-2`; requires the CUDA/clang
# toolchain to build, so it is deliberately absent from the default feature set.
llamacpp = ["dep:llama-cpp-2", "llama-cpp-2/cuda", "tokio/sync"]
# In-process pure-Rust candle engine (CPU). No GPU/C toolchain needed.
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
# candle plus CUDA kernels; built where the CUDA toolchain exists.
candle-cuda = ["candle", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dev-dependencies]
wiremock = "0.6"
