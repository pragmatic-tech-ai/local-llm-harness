[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
tokio-tungstenite = "0.26"
clap = { version = "4", features = ["derive", "env"] }
minijinja = "2"

[dev-dependencies]
wiremock = "0.6"

[lints.rust]
# The `llamacpp` feature is declared by a later task; until then, declare the expected cfg value.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("llamacpp"))'] }
