<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>local-llm-harness</title>
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden;
                     font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
        body { position: relative; }
        #app { position: absolute; inset: 0; width: 100%; height: 100%;
               background: #0A0A0B; overflow: hidden; cursor: default; }
        #app svg { display: block; }
        /* JS-free boot splash (same ground as BrowserWindow.backgroundColor); removed after first frame. */
        #splash { position: absolute; inset: 0; z-index: 20; background: #0A0A0B; }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="splash" role="status" aria-label="Loading"></div>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
